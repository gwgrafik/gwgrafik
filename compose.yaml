services:
  engine:
    build: .
    image: solana-profit-engine-v1:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    volumes:
      - engine-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  engine-data:
